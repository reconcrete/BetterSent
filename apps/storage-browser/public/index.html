<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage Browser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
      body { padding: 1rem; }
      .breadcrumb { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
      .breadcrumb a, .breadcrumb span { font-size: 0.95rem; }
      .breadcrumb .sep { color: var(--pico-muted-color); }
      table td { cursor: pointer; }
      table td.no-click { cursor: default; }
      .folder-icon::before { content: "\ud83d\udcc1 "; }
      .file-icon::before { content: "\ud83d\udcc4 "; }
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center; z-index: 100;
      }
      .modal-content {
        background: var(--pico-background-color); border-radius: 8px;
        width: 90vw; max-width: 900px; max-height: 85vh;
        display: flex; flex-direction: column; overflow: hidden;
      }
      .modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1rem 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color);
      }
      .modal-header h3 { margin: 0; font-size: 1rem; word-break: break-all; }
      .modal-body { padding: 1.5rem; overflow: auto; flex: 1; }
      .modal-body pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      .size { white-space: nowrap; }
      .actions { white-space: nowrap; }
      .actions a { margin-right: 0.5rem; }
      .empty { text-align: center; padding: 3rem; color: var(--pico-muted-color); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { h, render } from "https://esm.sh/preact@10.25.4";
      import { useState, useEffect } from "https://esm.sh/preact@10.25.4/hooks";
      import htm from "https://esm.sh/htm@3.1.1";

      const html = htm.bind(h);

      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      function BreadcrumbNav({ prefix, onNavigate }) {
        const parts = prefix.split("/").filter(Boolean);
        const crumbs = [{ label: "Root", path: "" }];
        for (let i = 0; i < parts.length; i++) {
          crumbs.push({ label: parts[i], path: parts.slice(0, i + 1).join("/") + "/" });
        }

        return html`
          <nav class="breadcrumb">
            ${crumbs.map((c, i) => html`
              ${i > 0 && html`<span class="sep">/</span>`}
              ${i === crumbs.length - 1
                ? html`<span><strong>${c.label}</strong></span>`
                : html`<a href="#" onClick=${(e) => { e.preventDefault(); onNavigate(c.path); }}>${c.label}</a>`
              }
            `)}
          </nav>
        `;
      }

      function FilePreview({ fileKey, onClose }) {
        const [content, setContent] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          setLoading(true);
          fetch("/api/preview/" + fileKey)
            .then((r) => r.text())
            .then((t) => { setContent(t); setLoading(false); })
            .catch(() => { setContent("Failed to load preview."); setLoading(false); });
        }, [fileKey]);

        return html`
          <div class="modal-overlay" onClick=${onClose}>
            <div class="modal-content" onClick=${(e) => e.stopPropagation()}>
              <div class="modal-header">
                <h3>${fileKey.split("/").pop()}</h3>
                <button class="outline" onClick=${onClose}>Close</button>
              </div>
              <div class="modal-body">
                ${loading
                  ? html`<p aria-busy="true">Loading...</p>`
                  : html`<pre>${content}</pre>`
                }
              </div>
            </div>
          </div>
        `;
      }

      function FileList({ prefix, onNavigate }) {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [preview, setPreview] = useState(null);

        useEffect(() => {
          setLoading(true);
          fetch("/api/list?prefix=" + encodeURIComponent(prefix))
            .then((r) => r.json())
            .then((d) => { setData(d); setLoading(false); })
            .catch(() => setLoading(false));
        }, [prefix]);

        if (loading) return html`<p aria-busy="true">Loading...</p>`;
        if (!data) return html`<p>Failed to load.</p>`;

        const { folders, files } = data;
        const isEmpty = folders.length === 0 && files.length === 0;

        const canPreview = (key) =>
          /\.(md|txt|json|csv|log)$/i.test(key);

        return html`
          ${preview && html`<${FilePreview} fileKey=${preview} onClose=${() => setPreview(null)} />`}

          ${isEmpty
            ? html`<div class="empty">This folder is empty.</div>`
            : html`
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Size</th>
                    <th>Modified</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${folders.map((f) => {
                    const name = f.replace(prefix, "").replace(/\/$/, "");
                    return html`
                      <tr onClick=${() => onNavigate(f)} style="cursor:pointer">
                        <td><span class="folder-icon">${name}</span></td>
                        <td>-</td>
                        <td>-</td>
                        <td class="no-click" onClick=${(e) => e.stopPropagation()}>-</td>
                      </tr>
                    `;
                  })}
                  ${files.map((f) => {
                    const name = f.key.replace(prefix, "");
                    return html`
                      <tr>
                        <td><span class="file-icon">${name}</span></td>
                        <td class="size">${formatBytes(f.size)}</td>
                        <td>${f.lastModified ? new Date(f.lastModified).toLocaleString() : "-"}</td>
                        <td class="actions no-click">
                          <a href=${"/api/file/" + f.key} download>Download</a>
                          ${canPreview(f.key) && html`
                            <a href="#" onClick=${(e) => { e.preventDefault(); e.stopPropagation(); setPreview(f.key); }}>Preview</a>
                          `}
                        </td>
                      </tr>
                    `;
                  })}
                </tbody>
              </table>
            `
          }
        `;
      }

      function App() {
        const [prefix, setPrefix] = useState("");

        return html`
          <main class="container">
            <h1>Storage Browser</h1>
            <${BreadcrumbNav} prefix=${prefix} onNavigate=${setPrefix} />
            <${FileList} prefix=${prefix} onNavigate=${setPrefix} />
          </main>
        `;
      }

      render(html`<${App} />`, document.getElementById("root"));
    </script>
  </body>
</html>
