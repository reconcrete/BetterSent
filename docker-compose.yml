# Bettersent — self-hosted on macbook-home, port slot 8090 (see ~/CLAUDE.md).
#
#   Host 8090 -> web   (bettersent.holod.dev)
#   Host 8091 -> api   (bettersent-api.holod.dev)
#   Host 8092 -> MinIO S3 API, loopback only
#   Host 8093 -> MinIO console, loopback only
#   Host 8094 -> postgres, loopback only
#
# The API gets its own hostname rather than a path prefix on the web origin:
# its route prefixes (/history in particular) collide with the SPA's client
# routes. Both hostnames sit directly under holod.dev so the existing wildcard
# certificate covers them.
#
# Storage is MinIO rather than the filesystem backend on purpose. The API picks
# S3 whenever all five S3 variables are set, and MinIO speaks the same
# path-style S3 the code already uses (forcePathStyle: true), so the storage
# code path is identical to Railway's. The filesystem backend would also write
# absolute local paths into send_history, which is not portable.

services:
  bettersent-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: bettersent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bettersent}
    ports:
      - "127.0.0.1:8094:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bettersent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [bettersent]

  bettersent-minio:
    image: minio/minio:latest
    container_name: bettersent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:8092:9000"
      - "127.0.0.1:8093:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [bettersent]

  # Creates the bucket if it does not exist, then exits.
  bettersent-minio-init:
    image: minio/mc:latest
    depends_on:
      bettersent-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://bettersent-minio:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-bettersent} &&
      echo 'bucket ready: ${S3_BUCKET:-bettersent}'
      "
    restart: "no"
    networks: [bettersent]

  bettersent-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bettersent-api
    restart: unless-stopped
    environment:
      # Load-bearing in three places: selects S3 storage, forces
      # secure/SameSite=None cookies, and disables the dev-only magic-link login.
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@bettersent-db:5432/${POSTGRES_DB:-bettersent}

      # CORS_ORIGIN does double duty as the Stripe redirect base, so it must be
      # the web app's origin, never a wildcard.
      CORS_ORIGIN: ${WEB_URL}
      TRUSTED_ORIGINS: ${WEB_URL}
      WEB_APP_URL: ${WEB_URL}
      BETTER_AUTH_URL: ${API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}

      # Parent domain shared by the web and API hostnames — see auth.ts.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Fallback sign-in when Google OAuth has no redirect URI for this domain.
      ENABLE_MAGIC_LINK: ${ENABLE_MAGIC_LINK:-0}
      MAGIC_LINK_LOG: ${MAGIC_LINK_LOG:-0}
      MAGIC_LINK_TTL: ${MAGIC_LINK_TTL:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Shared secret for the Telegram bot's x-internal-api-key header. If this
      # is unset the internal-auth path is silently disabled and the bot 401s.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEFUDDLE_API_KEY: ${DEFUDDLE_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}

      # stripe-node constructs at module import, so the process will not boot
      # without a syntactically valid key even when billing is unused.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_unused}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # All five must be set together — a partial group makes the storage
      # factory throw on the first extract rather than at boot.
      STORAGE_S3_ENDPOINT: http://bettersent-minio:9000
      STORAGE_S3_BUCKET: ${S3_BUCKET:-bettersent}
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      STORAGE_S3_PREFIX: ${S3_PREFIX:-extract}
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      bettersent-db:
        condition: service_healthy
      bettersent-minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [bettersent]

  bettersent-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${API_URL}
        VITE_ENABLE_MAGIC_LINK: ${ENABLE_MAGIC_LINK:-0}
        VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY:-}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-}
    container_name: bettersent-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      bettersent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_web_health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [bettersent]

  bettersent-telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: bettersent-telegram
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Reaches the API over the compose network, not the public hostname.
      API_URL: http://bettersent-api:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@bettersent-db:5432/${POSTGRES_DB:-bettersent}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    depends_on:
      bettersent-api:
        condition: service_healthy
    # The bot is a long-poller with no HTTP surface, so health is two checks.
    #
    # Token validity alone is not enough: if a second instance is polling the
    # same token, Telegram returns 409, grammy exits non-zero, and the restart
    # policy loops it — while getMe keeps answering 200. So the age of PID 1 is
    # checked first, and a process that keeps dying never gets old enough to
    # look healthy. Only one instance may poll a token at a time.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          age=$$(( $$(awk '{print int($$1)}' /proc/uptime) - $$(awk '{print int($$22/100)}' /proc/1/stat) ));
          [ "$$age" -gt 45 ] || exit 1;
          bun -e "fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getMe').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [bettersent]

  # One-shot: docker compose --profile tools run --rm bettersent-migrate
  bettersent-migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app/packages/db
    command: ["bunx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@bettersent-db:5432/${POSTGRES_DB:-bettersent}
    depends_on:
      bettersent-db:
        condition: service_healthy
    networks: [bettersent]

volumes:
  postgres_data:
  minio_data:

networks:
  bettersent:
    driver: bridge
